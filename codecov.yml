# The bar is 90% (the org's coverage standard).
# - Patch coverage is enforced at 90% now: the lines a pull request changes
#   must be 90% covered by tests.
# - Project coverage is informational until the repository measures 90%
#   (78% at 2.6.0). It's enforced at 90% from then on, with a 1% threshold.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
        informational: true
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: false
  require_changes: false
