# The bar is 90% (the org's coverage standard), enforced.
# - Project coverage must stay at 90% or above, with a 1% threshold
#   (96.5% at 2.6.1; 78% at 2.6.0).
# - Patch coverage: the lines a pull request changes must be 90% covered.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: false
  require_changes: false
