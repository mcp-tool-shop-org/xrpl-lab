name: CI

on:
  push:
    paths:
      - "xrpl_lab/**"
      - "modules/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "atlas/**"
      # Doc surfaces the drift gate (tests/test_docs_drift.py) pins — so a
      # doc-only hand-edit that diverges from the curriculum manifest still
      # re-runs the gate instead of merging stale.
      - "README.md"
      - "site/src/content/docs/handbook/**"
      - "site/src/data/curriculum.json"
      - "site/**"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  pull_request:
    paths:
      - "xrpl_lab/**"
      - "modules/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/**"
      - "atlas/**"
      # Doc surfaces the drift gate (tests/test_docs_drift.py) pins — so a
      # doc-only hand-edit that diverges from the curriculum manifest still
      # re-runs the gate instead of merging stale.
      - "README.md"
      - "site/src/content/docs/handbook/**"
      - "site/src/data/curriculum.json"
      - "site/**"
      # Codecov reads its status and comment settings from this file.
      - "codecov.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # 'true' on the one leg whose coverage and test results go to Codecov,
      # on a pull request or a push to the default branch.
      COVERAGE_LEG: ${{ matrix.python-version == '3.11' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      # The committed Atlas map (atlas/) must match the tree. Atlas needs
      # Node 22 or later, and the map is the same on every cell, so it is
      # checked on the 3.12 cell only.
      - name: Set up Node for Atlas
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        if: matrix.python-version == '3.12'
        run: npx --yes @dogfood-lab/atlas@1.20.0 check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check xrpl_lab/ tests/ > ruff.log 2>&1 || RUFF_EXIT=$?
          cat ruff.log
          exit ${RUFF_EXIT:-0}

      - name: Run tests
        id: tests
        run: pytest tests/ -v --tb=short --junitxml=pytest-report.xml ${{ env.COVERAGE_LEG == 'true' && '--cov=xrpl_lab --cov-report=term --cov-report=xml' || '' }}

      # The codecov job below uploads what these two steps save; this job
      # never holds an OIDC token. Coverage is saved when the tests passed,
      # and test results whenever they ran, failures included, because a
      # failing test is what that report exists to show. A save step with no
      # file to save fails the job. overwrite lets a re-run of this job
      # replace the artifact its earlier attempt saved.
      - name: Save coverage for Codecov
        if: ${{ env.COVERAGE_LEG == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Save test results for Codecov
        if: ${{ !cancelled() && env.COVERAGE_LEG == 'true' && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-test-results
          path: pytest-report.xml
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Lock file integrity (uv lock --check)
        # TC-004: verify.sh runs `uv lock --check` but CI did not, so a committed
        # uv.lock could drift out of sync with pyproject.toml (the CVE security
        # floors depend on the resolved tree) while CI stayed green. Mirror the
        # local gate here. Gated to a single matrix leg (3.12) like pip-audit —
        # the lock is interpreter-independent, so checking it twice is redundant.
        # `uv` is installed via pip (self-contained; no extra pinned action) and
        # the check is guarded on uv.lock existing, exactly like verify.sh.
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install uv
          if [ -f uv.lock ]; then
            uv lock --check
          fi

      - name: Dependency audit (pip-audit)
        # Catches known CVEs in the dependency tree. pip-audit is already a dev
        # dep (installed above via .[dev]) and verify.sh runs the same gate
        # locally, so CI mirrors local. Gated to a single matrix leg (3.12) —
        # auditing the resolved tree twice is redundant and the deps don't
        # differ by interpreter here; this keeps CI minutes lean.
        if: matrix.python-version == '3.12'
        # pipefail so a pip-audit non-zero exit (vulns found) propagates through
        # the tee and FAILS the job, rather than tee's success masking it.
        #
        # --skip-editable: the project installs itself editable via `pip install
        # -e ".[dev]"`; pip-audit cannot resolve the editable xrpl-lab on PyPI,
        # so we skip it and audit the dependency tree, not the project itself.
        #
        # NO --strict: `--strict` makes pip-audit exit non-zero whenever a dep is
        # *skipped* — including the editable self-package we skip above — so
        # `--strict --skip-editable` fails even with zero vulns ("distribution
        # marked as editable"). Without --strict, pip-audit still exits non-zero
        # on any *real* vulnerability, which is exactly the gate we want.
        #
        # --ignore-vuln PYSEC-2026-196: this advisory is against `pip` itself
        # (the installer/build toolchain), not a dependency we declare or ship.
        # CI upgrades pip above, and the audit is scoped to our declared tree;
        # auditing the installer is out of scope. Remove if pip is ever pinned
        # as a real dependency.
        run: |
          set -o pipefail
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-196 | tee pip-audit.log

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-artifacts-${{ matrix.python-version }}
          path: |
            pytest-report.xml
            ruff.log
            pip-audit.log
            .pytest_cache/lastfailed
          retention-days: 14
          if-no-files-found: ignore

  codecov:
    # Uploads what the test job saved, from a job of its own, so the OIDC
    # token that signs in to Codecov never exists beside the install and the
    # tests. The checkout, which keeps no token, is there only so Codecov can
    # match report paths to files: the job installs nothing and runs none of
    # the repository's code. It runs whenever the test job ran, failures
    # included, so failing tests still reach Codecov, and only on the events
    # that collect coverage. A run the concurrency group cancels uploads
    # nothing, and each run reads only its own artifacts.
    needs: lint-and-test
    if: ${{ !cancelled() && needs.lint-and-test.result != 'cancelled' && needs.lint-and-test.result != 'skipped' && (github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Each artifact unpacks where the test job wrote its files. A pattern
      # that matches nothing, unlike a name, does not fail: a failing test
      # run saves test results and no coverage.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-coverage
          path: .

      - name: Download test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: codecov-test-results
          path: .

      # After a passing test job both artifacts exist, so each upload runs,
      # and fails the job if its files are missing; after a failing one each
      # runs when its files arrived. Both sign in with OIDC, fail the job when
      # Codecov refuses the report, and run the Codecov CLI at a fixed version
      # rather than whichever is newest.
      - name: Upload coverage to Codecov
        if: ${{ needs.lint-and-test.result == 'success' || hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ./coverage.xml

      - name: Upload test results to Codecov
        if: ${{ needs.lint-and-test.result == 'success' || hashFiles('pytest-report.xml') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: true
          report_type: test_results
          disable_search: true
          files: ./pytest-report.xml

  # F-cdf586bf: vitest in site/ is a vacuous gate unless CI runs it.
  # Coordinator-owned — dashboard does not own this file.
  site-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Run site tests
        working-directory: site
        run: npm test
